{% extends 'base.html' %}

{% block content %}
<div class="container py-5" style="max-width: 900px;">
    <div class="mb-4">
        <span class="section-tag">Student onboarding</span>
        <h1 class="section-title mb-3">Tell LinkedTeens how you can help and what you are looking for.</h1>
    </div>

    <form method="post" class="bg-white p-4 rounded shadow-sm">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Full name</label>
                <input type="text" name="full_name" value="{{ profile.full_name }}" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label">Grade</label>
                <input type="text" name="grade" value="{{ profile.grade }}" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label">School</label>
                <input type="text" name="school" value="{{ profile.school }}" class="form-control">
            </div>
            <div class="col-12">
                <label class="form-label">About me</label>
                <textarea name="bio" rows="3" class="form-control">{{ profile.bio }}</textarea>
            </div>
            <div class="col-12">
                <label class="form-label">Interests</label>
                <select name="interests" class="form-select" multiple size="8">
                    {% for option in interests_options %}
                        <option value="{{ option }}" {% if option in profile.interests %}selected{% endif %}>{{ option }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12">
                <label class="form-label">Skills</label>
                <select name="skills" class="form-select" multiple size="8">
                    {% for option in skills_options %}
                        <option value="{{ option }}" {% if option in profile.skills %}selected{% endif %}>{{ option }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12">
                <label class="form-label">What I can offer</label>
                <select name="can_offer" class="form-select" multiple size="8">
                    {% for option in can_offer_options %}
                        <option value="{{ option }}" {% if option in profile.can_offer %}selected{% endif %}>{{ option }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12">
                <label class="form-label">I am looking for</label>
                <select name="looking_for" class="form-select" multiple size="8">
                    {% for option in looking_for_options %}
                        <option value="{{ option }}" {% if option in profile.looking_for %}selected{% endif %}>{{ option }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12">
                <label class="form-label">Goals</label>
                <select name="goals" class="form-select" multiple size="8">
                    {% for option in goals_options %}
                        <option value="{{ option }}" {% if option in profile.goals %}selected{% endif %}>{{ option }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12">
                <label class="form-label">Availability</label>
                <select name="availability" class="form-select" multiple size="6">
                    {% for option in availability_options %}
                        <option value="{{ option }}" {% if option in profile.availability %}selected{% endif %}>{{ option }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12">
                <label class="form-label" for="club_interest">Club interest</label>
                <select name="club_interest" id="club_interest" class="form-select" multiple size="8">
                    {% for value, label in club_choices %}
                        <option value="{{ value }}" {% if value in profile.club_interest %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
                <div class="form-text">Choose any clubs that match your goals.</div>
            </div>
        </div>

        <div class="d-flex justify-content-between mt-4">
            <a href="{% url 'dashboard' %}" class="btn btn-outline-primary">Skip for now</a>
            <button type="submit" class="btn btn-primary">Save profile</button>
        </div>
    </form>
</div>
{% endblock %}
