{% extends 'base.html' %}
{% block content %}
<div class="container py-5" style="max-width: 650px;"><span class="section-tag">Settings</span><h1 class="section-title">Account settings</h1><form method="post" class="bg-white p-4 rounded shadow-sm">{% csrf_token %}<label class="form-label">Username</label><input name="username" value="{{ user.username }}" class="form-control mb-3" required><label class="form-label">Email</label><input type="email" name="email" value="{{ user.email }}" class="form-control mb-3">{% if user.is_staff %}<label class="form-label">Role</label><select name="role" class="form-select mb-3">{% for value, label in role_choices %}<option value="{{ value }}" {% if user.role == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>{% endif %}<button class="btn btn-primary">Save settings</button></form></div>
{% endblock %}
