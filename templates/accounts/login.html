{% extends 'base.html' %}

{% block content %}
<div class="container py-5" style="max-width: 560px;">
	<h1 class="section-title text-center">Log in</h1>
	<form method="post" class="bg-white p-4 rounded shadow-sm">
		{% csrf_token %}
		{{ form.as_p }}
		<button type="submit" class="btn btn-primary w-100">Log in</button>
	</form>
	<p class="text-center mt-3">Don't have an account? <a href="{% url 'accounts:register' %}">Register</a></p>
</div>
{% endblock %}
